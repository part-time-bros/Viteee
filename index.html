<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AURORA EV — Interactive 3D Concept</title>
<style>
  :root{
    --fg:#e9eef5;
    --muted:#93a0b4;
    --accent:#5ec8ff;
    --panel:rgba(14,18,26,.72);
    --panel-hi:rgba(94,200,255,.16);
    --border:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#05070b;color:var(--fg);overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  }
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #scene.grabbing{cursor:grabbing}
  #scene.pointing{cursor:pointer}

  #brand{
    position:fixed;top:0;left:0;padding:16px 18px;pointer-events:none;
    text-shadow:0 1px 12px rgba(0,0,0,.6);
  }
  #brand h1{
    margin:0;font-size:15px;font-weight:650;letter-spacing:.34em;text-transform:uppercase;
  }
  #brand p{margin:4px 0 0;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}

  #readout{
    position:fixed;top:0;right:0;padding:16px 18px;text-align:right;pointer-events:none;
    font-variant-numeric:tabular-nums;font-size:11.5px;letter-spacing:.08em;color:var(--muted);
    text-shadow:0 1px 12px rgba(0,0,0,.6);
  }
  #readout b{display:block;font-size:13px;color:var(--fg);font-weight:600;letter-spacing:.12em}

  #hud{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:0 10px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  }
  .row{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto;
    max-width:min(980px,100%);
  }
  .lab{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    padding:0 8px 0 6px;user-select:none;
  }
  .sep{width:1px;align-self:stretch;background:var(--border);margin:2px 4px}
  button.btn{
    appearance:none;border:1px solid transparent;background:rgba(255,255,255,.06);color:var(--fg);
    font:inherit;font-size:12px;font-weight:520;letter-spacing:.02em;
    padding:8px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;
    transition:background .18s ease,border-color .18s ease,color .18s ease,transform .1s ease;
  }
  button.btn:hover{background:rgba(255,255,255,.13)}
  button.btn:active{transform:translateY(1px)}
  button.btn[aria-pressed="true"]{
    background:var(--panel-hi);border-color:rgba(94,200,255,.55);color:#cfeeff;
    box-shadow:0 0 16px rgba(94,200,255,.18) inset;
  }
  button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sw{
    width:26px;height:26px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.25);
    cursor:pointer;background-clip:padding-box;
  }
  .sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(94,200,255,.35)}
  #hint{
    font-size:11px;color:var(--muted);letter-spacing:.04em;text-align:center;
    text-shadow:0 1px 10px rgba(0,0,0,.7);pointer-events:none;padding:0 12px;
  }

  #loader{
    position:fixed;inset:0;display:grid;place-content:center;gap:14px;justify-items:center;
    background:#05070b;z-index:20;transition:opacity .6s ease;font-size:12px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--muted);
  }
  #loader.gone{opacity:0;pointer-events:none}
  .spin{
    width:34px;height:34px;border-radius:50%;
    border:2px solid rgba(255,255,255,.14);border-top-color:var(--accent);
    animation:sp 900ms linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  #err{
    position:fixed;inset:auto 12px 12px 12px;z-index:40;display:none;
    background:#3a0d12;border:1px solid #7d2430;color:#ffd9de;border-radius:10px;
    padding:10px 12px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
  }
  @media (max-width:720px){
    .lab{display:none}
    button.btn{font-size:11.5px;padding:8px 9px}
    #readout{display:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="brand">
  <h1>Aurora</h1>
  <p>Procedural EV — every surface generated in code</p>
</div>

<div id="readout">
  <b id="ro-mode">PARKED</b>
  <span id="ro-sub">motor idle · lights off</span>
</div>

<div id="hud">
  <div id="hint">Drag to orbit · scroll or pinch to zoom · click the car body, hood or light bars</div>
  <div class="row" id="row-panels">
    <span class="lab">Doors</span>
    <button class="btn" data-toggle="FL" aria-pressed="false">Front L</button>
    <button class="btn" data-toggle="FR" aria-pressed="false">Front R</button>
    <button class="btn" data-toggle="RL" aria-pressed="false">Rear L</button>
    <button class="btn" data-toggle="RR" aria-pressed="false">Rear R</button>
    <button class="btn" data-act="alldoors">All</button>
    <span class="sep"></span>
    <button class="btn" data-toggle="HOOD" aria-pressed="false">Frunk</button>
    <button class="btn" data-toggle="TRUNK" aria-pressed="false">Trunk</button>
  </div>
  <div class="row" id="row-systems">
    <span class="lab">Systems</span>
    <button class="btn" data-act="lights" aria-pressed="false">Lights</button>
    <button class="btn" data-act="motor" aria-pressed="false">Motor</button>
    <button class="btn" data-act="drive" aria-pressed="false">Drive</button>
    <button class="btn" data-act="sound" aria-pressed="false">Sound</button>
    <span class="sep"></span>
    <button class="btn" data-act="night" aria-pressed="false">Night</button>
    <button class="btn" data-act="reset">Reset view</button>
    <span class="sep"></span>
    <span class="lab">Paint</span>
    <span id="swatches"></span>
  </div>
</div>

<div id="loader"><div class="spin"></div><div>Generating geometry</div></div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }            from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment }          from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer }           from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }               from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }          from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }               from 'three/addons/postprocessing/OutputPass.js';

window.addEventListener('error', e => showError(e.message));
function showError(msg){
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Error: ' + msg;
}

/* ============================================================================
   1. SMALL MATH HELPERS
   ========================================================================== */

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const easeInOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
/** Frame-rate independent exponential approach. */
const approach = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));

/**
 * Builds a smooth 1D curve through a table of [x, y] samples using
 * Catmull-Rom style Hermite interpolation. Used for every silhouette line of
 * the car (roof height, beltline, half-width, ...).
 */
function makeCurve(pts){
  const n = pts.length;
  const xs = pts.map(p => p[0]);
  const ys = pts.map(p => p[1]);
  const m  = new Array(n);
  for (let i = 0; i < n; i++){
    const a = Math.max(0, i - 1), b = Math.min(n - 1, i + 1);
    m[i] = (ys[b] - ys[a]) / ((xs[b] - xs[a]) || 1);
  }
  return function(x){
    if (x <= xs[0])     return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0;
    while (i < n - 2 && x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i];
    const t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2*t3 - 3*t2 + 1) * ys[i]
         + (t3 - 2*t2 + t) * h * m[i]
         + (-2*t3 + 3*t2) * ys[i + 1]
         + (t3 - t2) * h * m[i + 1];
  };
}

/* ============================================================================
   2. PROCEDURAL TEXTURES  (canvas only — no image files anywhere)
   ========================================================================== */

function canvasTexture(w, h, draw, { srgb = false, repeat = null, aniso = 4 } = {}){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat){
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
  }
  t.anisotropy = aniso;
  return t;
}

/** Fine grey noise — drives the metallic-flake micro roughness on the paint. */
function makeFlakeTexture(){
  return canvasTexture(256, 256, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let i = 0; i < w * h; i++){
      const v = 198 + Math.random() * 57;
      img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v;
      img.data[i*4+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }, { repeat: [14, 9] });
}

/**
 * Tyre bump map. On a torus U runs around the circumference and V around the
 * tube, so V ≈ 0 / 1 is the centre of the tread, V ≈ 0.25 / 0.75 the sidewalls
 * and V ≈ 0.5 the inner bore. The pattern is drawn to match that layout.
 */
function makeTreadTexture(){
  return canvasTexture(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#7d7d7d'; ctx.fillRect(0, 0, w, h);
    const treadBands = [[-38, 38], [h - 38, h + 38]];
    for (const [y0, y1] of treadBands){
      ctx.fillStyle = '#efefef';
      for (let k = 0; k < 22; k++){                       // tread blocks
        const x = (k / 22) * w;
        ctx.fillRect(x, y0, w / 44, y1 - y0);
      }
      ctx.fillStyle = '#1a1a1a';                          // circumferential grooves
      ctx.fillRect(0, y0 + (y1 - y0) * 0.30 - 3, w, 6);
      ctx.fillRect(0, y0 + (y1 - y0) * 0.70 - 3, w, 6);
    }
    ctx.fillStyle = '#6a6a6a';                            // sidewall ribs
    for (const yc of [h * 0.26, h * 0.74]){
      for (let k = 0; k < 5; k++) ctx.fillRect(0, yc - 22 + k * 10, w, 3);
    }
    ctx.fillStyle = '#4a4a4a'; ctx.fillRect(0, h * 0.44, w, h * 0.12);  // bore
    for (let i = 0; i < 12000; i++){                      // grain
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.10})`;
      ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1);
    }
  }, { repeat: [22, 1] });
}

/** Studio floor: soft radial falloff plus a very faint grain so it isn't flat. */
function makeFloorTexture(){
  return canvasTexture(1024, 1024, (ctx, w, h) => {
    const g = ctx.createRadialGradient(w/2, h/2, w*0.04, w/2, h/2, w*0.52);
    g.addColorStop(0.00, '#39414e');
    g.addColorStop(0.28, '#252c36');
    g.addColorStop(0.62, '#12161c');
    g.addColorStop(1.00, '#080a0e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 26000; i++){
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.035})`;
      ctx.fillRect(Math.random() * w, Math.random() * h, 1.4, 1.4);
    }
  }, { srgb: true });
}

/** Blurred elliptical blob used as the soft contact shadow under the car. */
function makeContactShadowTexture(){
  return canvasTexture(512, 256, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
    g.addColorStop(0.00, 'rgba(0,0,0,0.92)');
    g.addColorStop(0.38, 'rgba(0,0,0,0.62)');
    g.addColorStop(0.70, 'rgba(0,0,0,0.20)');
    g.addColorStop(1.00, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.translate(w/2, h/2); ctx.scale(1, 0.52); ctx.translate(-w/2, -h/2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.restore();
  });
}

/* ============================================================================
   3. CAR PARAMETERS + CROSS-SECTION PROFILE
   ------------------------------------------------------------------------
   Length runs along +X (nose at +X), width along Z, height along Y with the
   ground plane at Y = 0. Every panel of the shell comes from lofting one
   parametric cross-section along X, so the whole body is a single (i, j) grid:
     i = station index along the length
     j = index around the closed section loop
   Panels (doors, hood, glass, ...) are just sub-rectangles of that grid, which
   guarantees they line up with their own openings exactly.
   ========================================================================== */

const CAR = {
  length: 4.90, width: 1.85, height: 1.45,
  frontAxle:  1.49, rearAxle: -1.44,   // wheelbase 2.93
  track: 1.60,                          // wheel centre at z = ±0.80
  wheelR: 0.34, wheelW: 0.235, rimR: 0.242,
  nose: 2.45, tail: -2.45
};

const K    = 6;          // samples per profile segment
const LOOP = 14 * K;     // points around the closed cross-section

// Named "bands" — an index into the +Z half of the section (0 = underbody centre).
// Everything downstream is expressed in these so the resolution can be retuned.
const BND = {
  sill: 2*K,             // rocker
  wide: 3*K,             // widest point
  belt: 4*K,             // beltline crease
  rail: 5*K,             // roof rail / top of the side glass
  max : 7*K - 1          // roof centre
};
const DOOR_B0  = BND.sill + 1, DOOR_B1  = BND.belt - 1;   // door skin
const GLASS_B0 = BND.belt,     GLASS_B1 = BND.rail - 1;   // side glass
const ROOF_B0  = BND.rail + 1;                            // panoramic roof
const ROCKER_B0 = Math.round(1.4 * K), ROCKER_B1 = BND.sill - 1;
const GLOW_B0   = K, GLOW_B1 = Math.round(1.25 * K);

// --- silhouette curves -------------------------------------------------------
const fTop = makeCurve([                    // roof / decklid / hood centre line
  [-2.45,0.905],[-2.25,0.985],[-1.95,1.040],[-1.70,1.075],[-1.45,1.135],
  [-1.15,1.240],[-0.85,1.348],[-0.50,1.428],[-0.10,1.450],[ 0.25,1.442],
  [ 0.55,1.396],[ 0.85,1.296],[ 1.05,1.178],[ 1.30,1.062],[ 1.60,1.014],
  [ 1.95,0.988],[ 2.20,0.950],[ 2.45,0.872]
]);
const fBelt = makeCurve([                   // beltline / shoulder crease
  [-2.45,0.845],[-2.10,0.905],[-1.70,0.930],[-1.20,0.925],[-0.40,0.900],
  [ 0.30,0.895],[ 0.90,0.912],[ 1.25,0.945],[ 1.70,0.960],[ 2.10,0.940],[ 2.45,0.855]
]);
const fRail = makeCurve([                   // roof rail / top of the side glass
  [-2.45,0.875],[-2.05,0.950],[-1.75,1.000],[-1.45,1.075],[-1.15,1.185],
  [-0.85,1.290],[-0.50,1.375],[-0.10,1.400],[ 0.30,1.390],[ 0.60,1.340],
  [ 0.90,1.238],[ 1.10,1.130],[ 1.40,1.035],[ 1.80,0.995],[ 2.15,0.940],[ 2.45,0.860]
]);
const fHalf = makeCurve([                   // body half-width
  [-2.45,0.640],[-2.28,0.790],[-2.05,0.878],[-1.75,0.914],[-1.20,0.925],
  [ 0.00,0.925],[ 0.90,0.925],[ 1.50,0.918],[ 1.90,0.892],[ 2.15,0.832],
  [ 2.32,0.722],[ 2.45,0.560]
]);
const fFloor = makeCurve([                  // underbody centre height
  [-2.45,0.455],[-2.20,0.290],[-1.95,0.180],[-1.60,0.145],[-1.00,0.138],
  [ 1.00,0.138],[ 1.60,0.145],[ 1.95,0.185],[ 2.20,0.300],[ 2.45,0.470]
]);
const fSill = makeCurve([                   // rocker / lower bumper edge
  [-2.45,0.560],[-2.10,0.395],[-1.75,0.300],[-1.30,0.272],[ 0.00,0.266],
  [ 1.30,0.272],[ 1.75,0.302],[ 2.10,0.400],[ 2.45,0.575]
]);
const fTumble = makeCurve([                 // greenhouse width / body width
  [-2.45,0.480],[-2.10,0.590],[-1.75,0.700],[-1.35,0.780],[-0.60,0.812],
  [ 0.30,0.812],[ 0.80,0.795],[ 1.10,0.740],[ 1.45,0.640],[ 1.90,0.540],[ 2.45,0.440]
]);

/** One half cross-section (+Z side) as 7*K + 1 points, from underbody centre to roof centre. */
function halfSection(x){
  const hw    = fHalf(x);
  const yTop  = fTop(x);
  let   yBelt = fBelt(x);
  let   ySill = fSill(x);
  let   yFloor= fFloor(x);
  // keep the control points strictly ordered in Y so the section can never fold
  yBelt  = Math.min(yBelt, yTop - 0.05);
  ySill  = Math.min(ySill, yBelt - 0.10);
  yFloor = Math.min(yFloor, ySill - 0.05);
  const yRail = clamp(fRail(x), yBelt + 0.035, yTop - 0.012);
  const yWide = lerp(ySill, yBelt, 0.55);
  const hwRail = hw * fTumble(x);

  const cps = [
    new THREE.Vector3(0, yFloor,         0),
    new THREE.Vector3(0, yFloor + 0.012, hw * 0.50),
    new THREE.Vector3(0, ySill,          hw * 0.930),   // BAND.sill
    new THREE.Vector3(0, yWide,          hw),           // BAND.wide (widest point)
    new THREE.Vector3(0, yBelt,          hw * 0.985),   // BAND.belt
    new THREE.Vector3(0, yRail,          hwRail),       // BAND.rail
    new THREE.Vector3(0, lerp(yRail, yTop, 0.88), hwRail * 0.62),
    new THREE.Vector3(0, yTop,           0)             // BAND.top
  ];
  const curve = new THREE.CatmullRomCurve3(cps, false, 'catmullrom', 0.5);
  const out = new Array(7*K + 1);
  for (let j = 0; j <= 7*K; j++) out[j] = curve.getPoint(j / (7*K));
  return out;
}

/** Full closed section loop at station x, optionally pinched for the nose/tail caps. */
function sectionLoop(x, sy, sz){
  const half = halfSection(x);
  if (sy !== 1 || sz !== 1){
    const yc = lerp(half[0].y, half[7*K].y, 0.62);
    for (const p of half){ p.y = yc + (p.y - yc) * sy; p.z *= sz; }
  }
  const loop = new Array(LOOP);
  for (let j = 0; j <= 7*K; j++) loop[j] = new THREE.Vector3(x, half[j].y, half[j].z);
  for (let j = 7*K + 1; j < LOOP; j++){
    const m = half[LOOP - j];
    loop[j] = new THREE.Vector3(x, m.y, -m.z);
  }
  return loop;
}

/* --- station list -----------------------------------------------------------
   Uniform stations through the middle, extra stations inserted exactly on every
   shut line so panel gaps land where they are supposed to, plus quarter-circle
   cap stations that round the nose and tail off. */
const KEY_X = [
   0.960, 0.975, -0.120, -0.105, -1.000, -0.985, -0.040, -0.160,
   1.050, 1.065,  2.060,  2.075, -1.590, -1.575, -2.100, -2.085,
   1.180, -1.180,  0.720, -0.720
];
const BODY_X0 = -2.28, BODY_X1 = 2.28;

function buildStations(){
  const set = new Set();
  for (let x = BODY_X0; x <= BODY_X1 + 1e-9; x += 0.036) set.add(+x.toFixed(4));
  set.add(+BODY_X1.toFixed(4));
  KEY_X.forEach(x => set.add(+x.toFixed(4)));
  const mid = [...set].sort((a, b) => a - b).map(x => ({ x, sy: 1, sz: 1 }));

  const cap = (base, tip, n) => {
    const out = [];
    for (let s = 1; s <= n; s++){
      const u = s / n, v = Math.sin(u * Math.PI / 2);
      out.push({ x: base + (tip - base) * v, sy: 1 - 0.10 * v * v, sz: Math.cos(u * Math.PI / 2) });
    }
    return out;
  };
  const rear  = cap(BODY_X0, CAR.tail, 7).reverse();
  const front = cap(BODY_X1, CAR.nose, 7);
  return [...rear, ...mid, ...front];
}

/* ============================================================================
   4. LOFTED GRID + SOLID BUILDER
   ========================================================================== */

const stations = buildStations();
const NI = stations.length;
const grid = stations.map(s => sectionLoop(s.x, s.sy, s.sz));
const gridN = computeGridNormals(grid);

/** Area-weighted vertex normals over the (i, j) grid, with j wrapping. */
function computeGridNormals(g){
  const ni = g.length;
  const nrm = g.map(row => row.map(() => new THREE.Vector3()));
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < ni - 1; i++){
    for (let j = 0; j < LOOP; j++){
      const j2 = (j + 1) % LOOP;
      const a = g[i][j], b = g[i+1][j], d = g[i][j2];
      e1.subVectors(b, a); e2.subVectors(d, a);
      n.crossVectors(e1, e2);                       // points outward
      nrm[i][j].add(n); nrm[i+1][j].add(n);
      nrm[i+1][j2].add(n); nrm[i][j2].add(n);
    }
  }
  const tmp = new THREE.Vector3();
  for (let i = 0; i < ni; i++){
    // section centroid, used as a fallback where the loft degenerates (nose tip)
    const c = new THREE.Vector3();
    for (let j = 0; j < LOOP; j++) c.add(g[i][j]);
    c.divideScalar(LOOP);
    for (let j = 0; j < LOOP; j++){
      const v = nrm[i][j];
      if (v.lengthSq() < 1e-12){
        tmp.subVectors(g[i][j], c);
        if (tmp.lengthSq() < 1e-12) tmp.set(1, 0, 0);
        v.copy(tmp);
      }
      v.normalize();
    }
  }
  return nrm;
}

const innerPt = (i, j, t) => new THREE.Vector3(
  grid[i][j].x - gridN[i][j].x * t,
  grid[i][j].y - gridN[i][j].y * t,
  grid[i][j].z - gridN[i][j].z * t
);

/**
 * Turns a masked set of grid cells into a watertight-looking solid panel:
 * outer skin (material 0) + inward-offset inner skin and edge rims (material 1).
 * Passing thickness = 0 yields a single-sided skin only (used for glass).
 */
function buildSolid(owner, id, thickness){
  const P = [], N = [], U = [], P2 = [], N2 = [], U2 = [];
  const has = (i, j) => i >= 0 && i < NI - 1 && owner[i][(j + LOOP) % LOOP] === id;
  const uvOf = (i, j) => [i / (NI - 1), (j % (LOOP + 1)) / LOOP];

  const tri = (arrP, arrN, arrU, p, n, uv) => {
    for (let k = 0; k < 3; k++){
      arrP.push(p[k].x, p[k].y, p[k].z);
      arrN.push(n[k].x, n[k].y, n[k].z);
      arrU.push(uv[k][0], uv[k][1]);
    }
  };

  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), fn = new THREE.Vector3();
  const dir = new THREE.Vector3(), mid = new THREE.Vector3(), cen = new THREE.Vector3();

  for (let i = 0; i < NI - 1; i++){
    for (let j = 0; j < LOOP; j++){
      if (owner[i][j] !== id) continue;
      const j2 = (j + 1) % LOOP;
      const a = grid[i][j],  b = grid[i+1][j],  c = grid[i+1][j2], d = grid[i][j2];
      const na = gridN[i][j], nb = gridN[i+1][j], nc = gridN[i+1][j2], nd = gridN[i][j2];
      const ua = uvOf(i, j), ub = uvOf(i+1, j), uc = uvOf(i+1, j+1), ud = uvOf(i, j+1);

      tri(P, N, U, [a, b, c], [na, nb, nc], [ua, ub, uc]);
      tri(P, N, U, [a, c, d], [na, nc, nd], [ua, uc, ud]);

      if (thickness > 0){
        const A = innerPt(i, j, thickness),   B = innerPt(i+1, j, thickness);
        const C = innerPt(i+1, j2, thickness), D = innerPt(i, j2, thickness);
        const iA = na.clone().negate(), iB = nb.clone().negate();
        const iC = nc.clone().negate(), iD = nd.clone().negate();
        tri(P2, N2, U2, [A, C, B], [iA, iC, iB], [ua, uc, ub]);
        tri(P2, N2, U2, [A, D, C], [iA, iD, iC], [ua, ud, uc]);

        cen.copy(a).add(b).add(c).add(d).multiplyScalar(0.25);
        const rim = (p0, p1, q0, q1, u0, u1) => {
          mid.copy(p0).add(p1).multiplyScalar(0.5);
          dir.subVectors(mid, cen);
          ab.subVectors(p1, p0); ac.subVectors(q1, p0); fn.crossVectors(ab, ac);
          let A0 = p0, A1 = p1, B0 = q0, B1 = q1, V0 = u0, V1 = u1;
          if (fn.dot(dir) < 0){ A0 = p1; A1 = p0; B0 = q1; B1 = q0; V0 = u1; V1 = u0; }
          ab.subVectors(A1, A0); ac.subVectors(B1, A0);
          fn.crossVectors(ab, ac).normalize();
          tri(P2, N2, U2, [A0, A1, B1], [fn, fn, fn], [V0, V1, V1]);
          tri(P2, N2, U2, [A0, B1, B0], [fn, fn, fn], [V0, V1, V0]);
        };
        if (!has(i - 1, j))  rim(a, d, A, D, ua, ud);
        if (!has(i + 1, j))  rim(b, c, B, C, ub, uc);
        if (owner[i][(j - 1 + LOOP) % LOOP] !== id) rim(a, b, A, B, ua, ub);
        if (owner[i][j2] !== id)                    rim(d, c, D, C, ud, uc);
      }
    }
  }
  if (!P.length) return null;

  const geo = new THREE.BufferGeometry();
  const pos = P.concat(P2), nor = N.concat(N2), uv = U.concat(U2);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  geo.addGroup(0, P.length / 3, 0);
  if (P2.length) geo.addGroup(P.length / 3, P2.length / 3, 1);
  geo.computeBoundingSphere();
  return geo;
}

/** Thin decal skin lying just above the shell — pillars, trims, character lines. */
function buildPatch(owner, test, offset){
  const P = [], N = [], U = [];
  const pt = (i, j) => new THREE.Vector3(
    grid[i][j].x + gridN[i][j].x * offset,
    grid[i][j].y + gridN[i][j].y * offset,
    grid[i][j].z + gridN[i][j].z * offset
  );
  for (let i = 0; i < NI - 1; i++){
    for (let j = 0; j < LOOP; j++){
      if (!test(i, j, owner[i][j])) continue;
      const j2 = (j + 1) % LOOP;
      const q = [pt(i, j), pt(i+1, j), pt(i+1, j2), pt(i, j2)];
      const n = [gridN[i][j], gridN[i+1][j], gridN[i+1][j2], gridN[i][j2]];
      const idx = [0,1,2, 0,2,3];
      for (const k of idx){
        P.push(q[k].x, q[k].y, q[k].z);
        N.push(n[k].x, n[k].y, n[k].z);
        U.push(i / (NI - 1), j / LOOP);
      }
    }
  }
  if (!P.length) return null;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(N, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(U, 2));
  geo.computeBoundingSphere();
  return geo;
}

// vertical shut lines: [xMin, xMax, bandMin, bandMax]
const SHUT_LINES = [
  [ 0.960,  0.975, DOOR_B0, GLASS_B1],     // front door leading edge
  [-0.120, -0.105, DOOR_B0, DOOR_B1],      // front / rear door split (B-pillar base)
  [-1.000, -0.985, DOOR_B0, DOOR_B1],      // rear door trailing edge
  [ 1.050,  1.065, BND.belt, BND.max],     // hood at the cowl
  [ 2.060,  2.075, BND.belt, BND.max],     // hood at the nose
  [-1.590, -1.575, BND.belt, BND.max],     // decklid at the rear glass
  [-2.100, -2.085, BND.belt, BND.max]      // decklid at the tail
];

// Horizontal shut lines are left as coincident edges rather than open slots: a
// whole band is ~5 cm tall, which would read as a trench instead of a panel gap.
function shutLine(x, band){
  for (const [x0, x1, b0, b1] of SHUT_LINES)
    if (x > x0 && x < x1 && band >= b0 && band <= b1) return true;
  return false;
}

const ARCH = { a: 0.425, b: 0.375, yMin: 0.40 };
function archCut(x, y, z){
  if (Math.abs(z) < 0.45 || y < ARCH.yMin) return false;
  for (const ax of [CAR.frontAxle, CAR.rearAxle]){
    const dx = (x - ax) / ARCH.a, dy = (y - CAR.wheelR) / ARCH.b;
    if (dx*dx + dy*dy < 1) return true;
  }
  return false;
}

// +Z is the right-hand side of the car (forward = +X, up = +Y)
const DOOR_DEFS = [
  { id:'FL', side:-1, paint:[-0.08, 0.96], glass:[-0.04, 0.96], hinge:[ 0.96,-0.95], angle:-1.00 },
  { id:'FR', side:+1, paint:[-0.08, 0.96], glass:[-0.04, 0.96], hinge:[ 0.96, 0.95], angle: 1.00 },
  { id:'RL', side:-1, paint:[-0.96,-0.12], glass:[-0.96,-0.16], hinge:[-0.12,-0.95], angle:-1.00 },
  { id:'RR', side:+1, paint:[-0.96,-0.12], glass:[-0.96,-0.16], hinge:[-0.12, 0.95], angle: 1.00 }
];

function cellOwner(x, y, z, band, side){
  if (archCut(x, y, z)) return null;
  if (shutLine(x, band)) return null;

  for (const d of DOOR_DEFS){
    if (side !== d.side) continue;
    if (band >= DOOR_B0  && band <= DOOR_B1  && x > d.paint[0] && x < d.paint[1]) return 'door' + d.id;
    if (band >= GLASS_B0 && band <= GLASS_B1 && x > d.glass[0] && x < d.glass[1]) return 'glass' + d.id;
  }
  if (band >= BND.belt){
    if (x > 1.09 && x < 2.06)   return 'hood';
    if (x > -2.06 && x < -1.59) return 'trunk';
    if (x > -1.55 && x < 1.05)
      return (band >= ROOF_B0 && x > -1.28 && x < 0.62) ? 'roof' : 'canopy';
  }
  return 'body';
}

// owner[i][j] for every cell of the loft
const owner = [];
{
  const c = new THREE.Vector3();
  for (let i = 0; i < NI - 1; i++){
    const row = new Array(LOOP);
    for (let j = 0; j < LOOP; j++){
      const j2 = (j + 1) % LOOP;
      c.copy(grid[i][j]).add(grid[i+1][j]).add(grid[i+1][j2]).add(grid[i][j2]).multiplyScalar(0.25);
      const side = j < LOOP/2 ? 1 : -1;
      const band = side > 0 ? j : LOOP - 1 - j;
      row[j] = cellOwner(c.x, c.y, c.z, band, side);
    }
    owner.push(row);
  }
}
const cellBand = j => (j < LOOP/2 ? j : LOOP - 1 - j);
const cellSide = j => (j < LOOP/2 ? 1 : -1);
const cellX = i => (stations[i].x + stations[i+1].x) * 0.5;

/**
 * Soft-cornered box, exactly w × h × d. The outline is inset by the bevel size
 * first because ExtrudeGeometry's bevel grows the profile outwards — skipping
 * that inset makes every box 2r too big in X and Y.
 */
function roundedBoxGeom(W, H, D, r = 0.03){
  const bev = Math.min(r, W/2 - 1e-3, H/2 - 1e-3, D/2 - 1e-3);
  const w = W - 2*bev, h = H - 2*bev, d = D;
  const rr = Math.min(r, w/2 - 1e-4, h/2 - 1e-4);
  const s = new THREE.Shape();
  const x = -w/2, y = -h/2;
  s.moveTo(x + rr, y);
  s.lineTo(x + w - rr, y); s.quadraticCurveTo(x + w, y, x + w, y + rr);
  s.lineTo(x + w, y + h - rr); s.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  s.lineTo(x + rr, y + h); s.quadraticCurveTo(x, y + h, x, y + h - rr);
  s.lineTo(x, y + rr); s.quadraticCurveTo(x, y, x + rr, y);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: d - 2*bev, bevelEnabled: true, bevelSize: bev, bevelThickness: bev,
    bevelSegments: 3, curveSegments: 5
  });
  g.translate(0, 0, -(d - 2*bev) / 2);
  g.computeVertexNormals();
  return g;
}

function createWheel(px, pz, side){
  const hub = new THREE.Group();                 // sits at the hub centre
  hub.position.set(px, CAR.wheelR, pz);
  const steer = new THREE.Group();               // front wheels steer inside this
  const spin  = new THREE.Group();               // rotates about its own axle (local Z)
  steer.add(spin); hub.add(steer);
  if (side < 0) steer.rotation.y = Math.PI;      // mirror so +Z is always outboard

  // --- tyre: torus flattened along the axle into a realistic section ---
  const tyreGeo = new THREE.TorusGeometry(0.262, 0.080, 18, 46);
  tyreGeo.scale(1, 1, CAR.wheelW / 2 / 0.080);
  const tyre = shadowy(new THREE.Mesh(tyreGeo, M.tyre));
  spin.add(tyre);

  // --- rim barrel + face ---
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(CAR.rimR, CAR.rimR, CAR.wheelW * 0.92, 34, 1, true), M.rimFace);
  barrel.rotation.x = Math.PI / 2;
  const face = new THREE.Mesh(
    new THREE.CylinderGeometry(CAR.rimR, CAR.rimR * 0.98, 0.018, 34), M.rim);
  face.rotation.x = Math.PI / 2;
  face.position.z = CAR.wheelW * 0.44;
  const hubCap = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.070, 0.03, 20), M.rim);
  hubCap.rotation.x = Math.PI / 2;
  hubCap.position.z = CAR.wheelW * 0.47;
  spin.add(barrel, face, hubCap);

  // --- turbine spokes: one shape, instanced around the hub ---
  const sp = new THREE.Shape();
  sp.moveTo(0.058, -0.082);
  sp.lineTo(0.232, -0.056);
  sp.quadraticCurveTo(0.248, 0, 0.232, 0.056);
  sp.lineTo(0.058, 0.082);
  sp.quadraticCurveTo(0.044, 0, 0.058, -0.082);
  const spokeGeo = new THREE.ExtrudeGeometry(sp, {
    depth: 0.034, bevelEnabled: true, bevelSize: 0.009, bevelThickness: 0.009,
    bevelSegments: 2, curveSegments: 5
  });
  spokeGeo.translate(0, 0, -0.015);
  const spokes = new THREE.InstancedMesh(spokeGeo, M.rim, SPOKES);
  const mtx = new THREE.Matrix4(), rot = new THREE.Matrix4();
  for (let k = 0; k < SPOKES; k++){
    mtx.makeRotationZ((k / SPOKES) * Math.PI * 2);
    rot.makeRotationX(0.34);                     // turbine twist
    mtx.multiply(rot);
    mtx.setPosition(0, 0, CAR.wheelW * 0.36);
    spokes.setMatrixAt(k, mtx);
  }
  spokes.instanceMatrix.needsUpdate = true;
  spokes.castShadow = true;
  spin.add(spokes);

  // --- lug nuts ---
  const lugGeo = new THREE.CylinderGeometry(0.017, 0.017, 0.022, 6);
  lugGeo.rotateX(Math.PI / 2);
  const lugs = new THREE.InstancedMesh(lugGeo, M.metalDark, SPOKES);
  for (let k = 0; k < SPOKES; k++){
    const a = (k / SPOKES) * Math.PI * 2 + 0.6;
    mtx.identity().setPosition(Math.cos(a) * 0.085, Math.sin(a) * 0.085, CAR.wheelW * 0.47);
    lugs.setMatrixAt(k, mtx);
  }
  lugs.instanceMatrix.needsUpdate = true;
  spin.add(lugs);

  // --- brake disc (spins) + caliper (does not) ---
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.196, 0.196, 0.020, 30), M.disc);
  disc.rotation.x = Math.PI / 2;
  disc.position.z = CAR.wheelW * 0.10;
  spin.add(disc);

  const calGeo = new THREE.TorusGeometry(0.182, 0.030, 8, 10, Math.PI * 0.55);
  calGeo.scale(1, 1, 1.7);
  const caliper = new THREE.Mesh(calGeo, M.caliper);
  caliper.rotation.z = Math.PI * 0.30;           // sits behind / above the hub
  caliper.position.z = CAR.wheelW * 0.10;
  steer.add(caliper);

  wheelsG.add(hub);
  const w = { hub, steer, spin, side, front: px > 0 };
  wheels.push(w);
  return w;
}

function drawScreen(){
  const w = screenCanvas.width, h = screenCanvas.height;
  sctx.fillStyle = '#05080d'; sctx.fillRect(0, 0, w, h);

  const on = carState.motorOn || carState.driving;
  const accent = on ? '#5ec8ff' : '#4a5568';

  // speed
  sctx.fillStyle = '#eef4ff';
  sctx.font = '700 108px ui-sans-serif, system-ui, sans-serif';
  sctx.textAlign = 'right'; sctx.textBaseline = 'alphabetic';
  sctx.fillText(String(Math.round(carState.speed)), 250, 150);
  sctx.fillStyle = '#7f8b9e';
  sctx.font = '500 26px ui-sans-serif, system-ui, sans-serif';
  sctx.fillText('km/h', 250, 186);

  // gear column
  sctx.textAlign = 'left';
  const gears = ['P', 'R', 'N', 'D'];
  const active = carState.driving ? 3 : 0;
  gears.forEach((g, i) => {
    sctx.fillStyle = i === active ? '#eef4ff' : '#333c4a';
    sctx.font = `${i === active ? 700 : 500} 30px ui-sans-serif, system-ui, sans-serif`;
    sctx.fillText(g, 292 + i * 42, 70);
  });

  // battery bar
  const bx = 292, by = 108, bw = 176, bh = 30;
  sctx.strokeStyle = '#3a4655'; sctx.lineWidth = 3;
  sctx.beginPath(); sctx.roundRect(bx, by, bw, bh, 6); sctx.stroke();
  sctx.fillStyle = '#3a4655';
  sctx.fillRect(bx + bw + 4, by + 9, 6, 12);
  const pct = carState.battery / 100;
  sctx.fillStyle = pct > 0.2 ? '#3ddc84' : '#ff5f57';
  sctx.beginPath(); sctx.roundRect(bx + 4, by + 4, (bw - 8) * pct, bh - 8, 4); sctx.fill();
  sctx.fillStyle = '#9fb0c6';
  sctx.font = '600 22px ui-sans-serif, system-ui, sans-serif';
  sctx.fillText(`${Math.round(carState.battery)}%  ·  ${Math.round(carState.battery * 4.6)} km`, bx, by + 58);

  // plan-view car icon with live door state
  const cx = 150, cy = 245, cw = 92, ch = 128;
  sctx.strokeStyle = accent; sctx.lineWidth = 4;
  sctx.beginPath(); sctx.roundRect(cx - cw/2, cy - ch/2, cw, ch, 26); sctx.stroke();
  sctx.fillStyle = 'rgba(94,200,255,.10)'; sctx.fill();
  const doorDots = [['FL', -1, -1], ['FR', 1, -1], ['RL', -1, 1], ['RR', 1, 1]];
  for (const [id, sx, sy] of doorDots){
    const openish = doors[id].t > 0.02;
    sctx.strokeStyle = openish ? '#ffb347' : '#2f3a49';
    sctx.lineWidth = 6;
    sctx.beginPath();
    const px = cx + sx * (cw/2), py = cy + sy * 22;
    if (openish){
      sctx.moveTo(px, py - 20);
      sctx.lineTo(px + sx * 26, py + 6);
    } else {
      sctx.moveTo(px, py - 20); sctx.lineTo(px, py + 18);
    }
    sctx.stroke();
  }
  if (carState.hood.t > 0.02){
    sctx.strokeStyle = '#ffb347'; sctx.lineWidth = 6;
    sctx.beginPath(); sctx.moveTo(cx - 26, cy - ch/2 - 4); sctx.lineTo(cx + 26, cy - ch/2 - 18); sctx.stroke();
  }
  if (carState.trunk.t > 0.02){
    sctx.strokeStyle = '#ffb347'; sctx.lineWidth = 6;
    sctx.beginPath(); sctx.moveTo(cx - 26, cy + ch/2 + 4); sctx.lineTo(cx + 26, cy + ch/2 + 18); sctx.stroke();
  }

  // status strip
  sctx.fillStyle = accent;
  sctx.font = '600 22px ui-sans-serif, system-ui, sans-serif';
  sctx.fillText(carState.motorOn ? 'DRIVE UNIT READY' : 'SYSTEM STANDBY', 292, 232);
  sctx.fillStyle = carState.lights ? '#5ec8ff' : '#2f3a49';
  sctx.fillText(carState.lights ? 'LIGHTS ON' : 'LIGHTS OFF', 292, 268);
  sctx.fillStyle = '#2f3a49';
  sctx.font = '500 18px ui-sans-serif, system-ui, sans-serif';
  sctx.fillText('AURORA · PROCEDURAL', 292, 300);

  screenTex.needsUpdate = true;
}

/** Walks the loft picking the point closest to a target height on one side. */
function edgePath(iFrom, iTo, targetY, side){
  const pts = [], nrm = [];
  const step = iTo > iFrom ? 1 : -1;
  for (let i = iFrom; step > 0 ? i <= iTo : i >= iTo; i += step){
    let best = -1, bestD = 1e9;
    for (let j = 1; j < 7*K; j++){
      const idx = side > 0 ? j : LOOP - j;
      const d = Math.abs(grid[i][idx].y - targetY);
      if (d < bestD){ bestD = d; best = idx; }
    }
    pts.push(grid[i][best]); nrm.push(gridN[i][best]);
  }
  return { pts, nrm };
}

/** Sweeps a thin rectangular bar along a path that hugs the body surface. */
function sweepBar(pts, nrm, halfH, inset, outset){
  const P = [], idx = [];
  const t = new THREE.Vector3(), u = new THREE.Vector3(), tmp = new THREE.Vector3();
  const n = pts.length;
  for (let i = 0; i < n; i++){
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    t.subVectors(b, a).normalize();
    u.crossVectors(t, nrm[i]).normalize();          // across the bar, on the surface
    for (const [hu, hn] of [[-1, inset], [1, inset], [1, outset], [-1, outset]]){
      tmp.copy(pts[i]).addScaledVector(u, hu * halfH).addScaledVector(nrm[i], hn);
      P.push(tmp.x, tmp.y, tmp.z);
    }
  }
  for (let i = 0; i < n - 1; i++){
    const a = i * 4, b = (i + 1) * 4;
    for (let k = 0; k < 4; k++){
      const k2 = (k + 1) % 4;
      idx.push(a + k, b + k, b + k2, a + k, b + k2, a + k2);
    }
  }
  // end caps
  idx.push(0, 2, 1, 0, 3, 2);
  const e = (n - 1) * 4;
  idx.push(e + 0, e + 1, e + 2, e + 0, e + 2, e + 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/** Relaxes a surface-hugging path so swept bars read as clean creases. */
function smoothPath(pts, nrm, iters = 3){
  let P = pts.map(p => p.clone()), N = nrm.map(n => n.clone());
  for (let it = 0; it < iters; it++){
    const P2 = P.map(p => p.clone()), N2 = N.map(n => n.clone());
    for (let i = 1; i < P.length - 1; i++){
      P2[i].copy(P[i-1]).addScaledVector(P[i], 2).add(P[i+1]).multiplyScalar(0.25);
      N2[i].copy(N[i-1]).addScaledVector(N[i], 2).add(N[i+1]).normalize();
    }
    P = P2; N = N2;
  }
  return { pts: P, nrm: N };
}

const iOfX = x => {
  let best = 0, bd = 1e9;
  for (let i = 0; i < NI; i++){ const d = Math.abs(stations[i].x - x); if (d < bd){ bd = d; best = i; } }
  return best;
};

const lightBars = { front: null, rear: null };
{
  // front bar wraps from the left fender, around the nose, to the right fender
  const iNose = NI - 2, iSideF = iOfX(1.88);
  const left  = edgePath(iSideF, iNose, 0.845, -1);
  const right = edgePath(iNose, iSideF, 0.845, 1);
  const f = smoothPath(left.pts.concat(right.pts), left.nrm.concat(right.nrm));
  const fPts = f.pts, fNrm = f.nrm;
  chassis.add(new THREE.Mesh(sweepBar(fPts, fNrm, 0.052, -0.004, 0.015), M.trimDark));
  lightBars.front = new THREE.Mesh(sweepBar(fPts, fNrm, 0.024, 0.002, 0.022), M.headlight);
  chassis.add(pick(lightBars.front, 'lights'));

  // rear bar
  const iTail = 1, iSideR = iOfX(-1.98);
  const rl = edgePath(iSideR, iTail, 0.855, -1);
  const rr = edgePath(iTail, iSideR, 0.855, 1);
  const r = smoothPath(rl.pts.concat(rr.pts), rl.nrm.concat(rr.nrm));
  const rPts = r.pts, rNrm = r.nrm;
  chassis.add(new THREE.Mesh(sweepBar(rPts, rNrm, 0.048, -0.004, 0.014), M.trimDark));
  lightBars.rear = new THREE.Mesh(sweepBar(rPts, rNrm, 0.022, 0.002, 0.021), M.taillight);
  chassis.add(pick(lightBars.rear, 'lights'));

  // battery-edge light strip along the rocker
  const glowGeo = buildPatch(owner, (i, j, o) =>
    o === 'body' && cellBand(j) >= GLOW_B0 && cellBand(j) <= GLOW_B1 && Math.abs(cellX(i)) < 1.30, 0.004);
  if (glowGeo) chassis.add(new THREE.Mesh(glowGeo, M.batteryGlow));
}

// mirrors
for (const sz of [1, -1]){
  const g = new THREE.Group();
  g.position.set(0.86, 0.925, sz * 0.895);
  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.030, 0.13, 10), M.trimDark);
  stalk.rotation.x = sz * -0.9; stalk.rotation.z = 0.25;
  stalk.position.set(0.02, 0.005, sz * 0.045);
  const shellM = new THREE.Mesh(roundedBoxGeom(0.11, 0.085, 0.20, 0.035), M.paint);
  shellM.position.set(-0.02, 0.035, sz * 0.115);
  const glassM = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.07), M.chrome);
  glassM.rotation.y = Math.PI / 2 + (sz > 0 ? 0 : Math.PI);
  glassM.position.set(-0.075, 0.035, sz * 0.115);
  g.add(stalk, shellM, glassM);
  chassis.add(g);
}

// front and rear valances, lifted straight off the shell so they cannot float
trimBand(chassis, (i, j, o) => o === 'body' && cellBand(j) >= K && cellBand(j) <= BND.sill &&
         (cellX(i) > 1.94 || cellX(i) < -1.94), M.trimDark, 0.006);

// rear diffuser fins
{
  const finGeo = roundedBoxGeom(0.13, 0.075, 0.020, 0.008);
  const fins = new THREE.InstancedMesh(finGeo, M.metalDark, 5);
  const m = new THREE.Matrix4();
  for (let k = 0; k < 5; k++){
    m.makeRotationX(0).setPosition(-2.15, 0.325, -0.30 + k * 0.15);
    fins.setMatrixAt(k, m);
  }
  fins.instanceMatrix.needsUpdate = true;
  chassis.add(fins);
}

/* ============================================================================
   12. RENDERER, SCENE, LIGHTING, CAMERA
   ========================================================================== */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.74;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if ('transmissionResolutionScale' in renderer) renderer.transmissionResolutionScale = 0.6;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d12);
scene.fog = new THREE.Fog(0x0a0d12, 24, 62);
scene.add(car);

// code-generated environment for believable paint and glass reflections
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.035);
scene.environment = envRT.texture;
scene.environmentIntensity = 0.60;
pmrem.dispose();

RectAreaLightUniformsLib.init();

const keyLight = new THREE.DirectionalLight(0xffffff, 1.45);
keyLight.position.set(5.2, 8.0, 4.4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 26;
keyLight.shadow.camera.left = -4.2; keyLight.shadow.camera.right = 4.2;
keyLight.shadow.camera.top = 4.2;   keyLight.shadow.camera.bottom = -4.2;
keyLight.shadow.bias = -0.0006;
keyLight.shadow.normalBias = 0.022;
scene.add(keyLight, keyLight.target);

const fillLight = new THREE.DirectionalLight(0x9dc4ff, 0.28);
fillLight.position.set(-6, 4, -5);
scene.add(fillLight);

const hemi = new THREE.HemisphereLight(0xbcd6ff, 0x14181e, 0.40);
scene.add(hemi);

const rectLight = new THREE.RectAreaLight(0xffffff, 0.95, 7.5, 3.2);
rectLight.position.set(0, 5.2, 0.4);
rectLight.lookAt(0, 0.6, 0);
scene.add(rectLight);

// headlight beams (no shadows — they are for atmosphere, the emissive bar is the look)
const beams = [];
for (const sz of [1, -1]){
  const s = new THREE.SpotLight(0xdcefff, 0, 26, 0.55, 0.82, 1.3);
  s.position.set(2.25, 0.79, sz * 0.55);
  s.target.position.set(11, -0.6, sz * 1.9);
  scene.add(s, s.target);
  beams.push(s);
}

// --- floor + contact shadow ---------------------------------------------------
const floorMat = new THREE.MeshStandardMaterial({
  map: makeFloorTexture(), roughness: 0.78, metalness: 0.04, envMapIntensity: 0.35
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(6.2, 3.1),
  new THREE.MeshBasicMaterial({
    map: makeContactShadowTexture(), transparent: true, opacity: 0.85,
    depthWrite: false, blending: THREE.NormalBlending
  })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.006;
contact.renderOrder = -1;
scene.add(contact);

// --- camera + controls --------------------------------------------------------
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
const HOME = new THREE.Vector3(6.4, 2.5, 5.6);
camera.position.copy(HOME);

/** Pull the camera back on narrow / portrait viewports so the car still fits. */
function homeScale(){
  const a = window.innerWidth / window.innerHeight;
  return a < 0.72 ? 1.62 : a < 1.05 ? 1.3 : 1.0;
}
function goHome(resume = true){
  const t = new THREE.Vector3(0, 0.72, 0);
  camera.position.copy(t).addScaledVector(HOME.clone().sub(t), homeScale());
  controls.target.copy(t);
  if (resume) controls.autoRotate = true;
  controls.update();
}

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.target.set(0, 0.72, 0);
controls.minDistance = 3.6;
controls.maxDistance = 15;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI / 2 - 0.045;   // never dips under the floor
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.enablePan = true;
controls.screenSpacePanning = false;
controls.update();

const stopAuto = () => { controls.autoRotate = false; };
controls.addEventListener('start', stopAuto);
canvas.addEventListener('wheel', stopAuto, { passive: true });

// --- post processing ----------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2), 0.55, 0.44, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================================
   13. STATE + INTERACTION
   ========================================================================== */

const carState = {
  lights: false, motorOn: false, driving: false, night: false, sound: true,
  speed: 0, battery: 87, motorLevel: 0,
  hood:  { t: 0, target: 0, state: 'closed' },
  trunk: { t: 0, target: 0, state: 'closed' }
};

function togglePanel(p){
  if (p.state === 'opening' || p.state === 'closing') return;   // ignore repeat clicks
  p.target = p.target > 0.5 ? 0 : 1;
  p.state  = p.target > 0.5 ? 'opening' : 'closing';
}
function stepPanel(p, dt, rate = 1.15){
  if (p.t === p.target) return;
  const dir = p.target > p.t ? 1 : -1;
  p.t = clamp(p.t + dir * dt * rate, 0, 1);
  if (p.t === p.target) p.state = p.target > 0.5 ? 'open' : 'closed';
}

const ACTIONS = {
  doorFL: () => togglePanel(doors.FL), doorFR: () => togglePanel(doors.FR),
  doorRL: () => togglePanel(doors.RL), doorRR: () => togglePanel(doors.RR),
  hood:   () => togglePanel(carState.hood),
  trunk:  () => togglePanel(carState.trunk),
  lights: () => setLights(!carState.lights),
  motor:  () => setMotor(!carState.motorOn)
};

function setLights(on){ carState.lights = on; syncUI(); }
function setMotor(on){
  carState.motorOn = on;
  if (!on) carState.driving = false;
  if (on) ensureAudio();
  syncUI();
}
function setDrive(on){
  carState.driving = on;
  if (on){ carState.motorOn = true; ensureAudio(); }
  syncUI();
}
function setNight(on){
  carState.night = on;
  scene.background.set(on ? 0x03050a : 0x0a0d12);
  scene.fog.color.set(on ? 0x03050a : 0x0a0d12);
  keyLight.intensity   = on ? 0.22 : 1.45;
  fillLight.intensity  = on ? 0.06 : 0.28;
  hemi.intensity       = on ? 0.10 : 0.40;
  rectLight.intensity  = on ? 0.14 : 0.95;
  scene.environmentIntensity = on ? 0.14 : 0.60;
  renderer.toneMappingExposure = on ? 0.95 : 0.74;
  bloom.strength = on ? 0.62 : 0.55;
  contact.material.opacity = on ? 0.5 : 0.85;
  if (on && !carState.lights) setLights(true);
  syncUI();
}

// --- pointer picking ----------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = null, hoverAction = null;

function setPointer(e){
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
function castAction(){
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  return hits.length ? hits[0].object.userData.action : null;
}
canvas.addEventListener('pointerdown', e => {
  downAt = { x: e.clientX, y: e.clientY };
  canvas.classList.add('grabbing');
});
canvas.addEventListener('pointerup', e => {
  canvas.classList.remove('grabbing');
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 7) return;                    // that was an orbit drag, not a click
  setPointer(e);
  const a = castAction();
  if (a && ACTIONS[a]){ ACTIONS[a](); syncUI(); }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  setPointer(e);
  hoverAction = castAction();
  canvas.classList.toggle('pointing', !!hoverAction);
});
canvas.addEventListener('pointerleave', () => { hoverAction = null; });

/* --- synthesised drive-unit hum (Web Audio, no files) ----------------------- */
const audio = { ctx: null, gain: null, oscA: null, oscB: null, filter: null };
function ensureAudio(){
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = audio.ctx = new AC();
  const gain = audio.gain = ctx.createGain();
  gain.gain.value = 0;
  const filter = audio.filter = ctx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 900; filter.Q.value = 6;
  const oscA = audio.oscA = ctx.createOscillator(); oscA.type = 'sawtooth'; oscA.frequency.value = 70;
  const oscB = audio.oscB = ctx.createOscillator(); oscB.type = 'sine';     oscB.frequency.value = 140;
  const g2 = ctx.createGain(); g2.gain.value = 0.35;
  oscA.connect(filter); oscB.connect(g2); g2.connect(filter);
  filter.connect(gain); gain.connect(ctx.destination);
  oscA.start(); oscB.start();
}
function updateAudio(level){
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  const vol = carState.sound ? level * 0.09 : 0;
  audio.gain.gain.setTargetAtTime(vol, t, 0.12);
  const f = 62 + level * 190 + carState.speed * 1.6;
  audio.oscA.frequency.setTargetAtTime(f, t, 0.18);
  audio.oscB.frequency.setTargetAtTime(f * 2.02, t, 0.18);
  audio.filter.frequency.setTargetAtTime(520 + level * 1900, t, 0.2);
}

/* --- HUD wiring ------------------------------------------------------------- */
const hud = {
  toggles: [...document.querySelectorAll('[data-toggle]')],
  acts:    [...document.querySelectorAll('[data-act]')],
  mode:    document.getElementById('ro-mode'),
  sub:     document.getElementById('ro-sub')
};
const panelOf = id => id === 'HOOD' ? carState.hood : id === 'TRUNK' ? carState.trunk : doors[id];

hud.toggles.forEach(b => b.addEventListener('click', () => { togglePanel(panelOf(b.dataset.toggle)); syncUI(); }));
hud.acts.forEach(b => b.addEventListener('click', () => {
  switch (b.dataset.act){
    case 'lights': setLights(!carState.lights); break;
    case 'motor':  setMotor(!carState.motorOn); break;
    case 'drive':  setDrive(!carState.driving); break;
    case 'night':  setNight(!carState.night); break;
    case 'sound':  carState.sound = !carState.sound; if (carState.sound) ensureAudio(); syncUI(); break;
    case 'alldoors': {
      const anyOpen = ['FL','FR','RL','RR'].some(id => doors[id].target > 0.5);
      ['FL','FR','RL','RR'].forEach(id => {
        const d = doors[id];
        if (d.state === 'opening' || d.state === 'closing') return;
        d.target = anyOpen ? 0 : 1;
        d.state  = anyOpen ? 'closing' : 'opening';
      });
      syncUI();
      break;
    }
    case 'reset': goHome(); break;
  }
}));

// paint swatches
const swWrap = document.getElementById('swatches');
PAINTS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'btn sw';
  b.style.background = '#' + p.color.toString(16).padStart(6, '0');
  b.title = p.name;
  b.setAttribute('aria-label', 'Paint: ' + p.name);
  b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
  b.addEventListener('click', () => {
    M.paint.color.setHex(p.color);
    M.paint.metalness = p.metal;
    M.paint.roughness = p.rough;
    [...swWrap.children].forEach((c, k) => c.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
  });
  swWrap.appendChild(b);
});

function syncUI(){
  hud.toggles.forEach(b => b.setAttribute('aria-pressed', String(panelOf(b.dataset.toggle).target > 0.5)));
  const st = { lights: carState.lights, motor: carState.motorOn, drive: carState.driving,
               night: carState.night, sound: carState.sound };
  hud.acts.forEach(b => { if (b.dataset.act in st) b.setAttribute('aria-pressed', String(st[b.dataset.act])); });
  hud.mode.textContent = carState.driving ? 'DRIVE' : (carState.motorOn ? 'READY' : 'PARKED');
  hud.sub.textContent =
    `${carState.motorOn ? 'motor running' : 'motor idle'} · lights ${carState.lights ? 'on' : 'off'}`;
}

/* ============================================================================
   14. RESIZE + ANIMATION LOOP
   ========================================================================== */

let resizeTimer = 0;
function applyResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w / 2, h / 2);
}
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(applyResize, 110);
});
window.addEventListener('orientationchange', () => setTimeout(applyResize, 220));

const clock = new THREE.Clock();
const motorHome = motor.group.position.clone();
let screenClock = 0;

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();

  // ---- panels -------------------------------------------------------------
  for (const id of ['FL', 'FR', 'RL', 'RR']){
    const d = doors[id];
    stepPanel(d, dt, 1.05);
    d.group.rotation.y = easeInOutCubic(d.t) * d.def.angle;
    // flush handle pops out when the pointer is over that door
    const want = hoverAction === 'door' + id ? 1 : 0;
    d.handle.userData.out = approach(d.handle.userData.out, want, 9, dt);
    d.handle.position.z = d.handle.userData.restZ + d.def.side * 0.032 * d.handle.userData.out;
  }
  stepPanel(carState.hood, dt, 0.9);
  {
    const a = easeInOutCubic(carState.hood.t) * 0.62;
    hoodGroup.rotation.z = a;
    hoodGroup.position.set(hoodPivot.x + Math.sin(a) * 0.05,
                           hoodPivot.y + Math.sin(a) * 0.16, hoodPivot.z);
  }
  stepPanel(carState.trunk, dt, 0.9);
  {
    const a = easeInOutCubic(carState.trunk.t) * 0.60;
    trunkGroup.rotation.z = -a;
    trunkGroup.position.set(trunkPivot.x - Math.sin(a) * 0.03,
                            trunkPivot.y + Math.sin(a) * 0.14, trunkPivot.z);
  }

  // ---- drive unit ---------------------------------------------------------
  const wantLevel = carState.motorOn ? (carState.driving ? 1.0 : 0.42) : 0;
  carState.motorLevel = approach(carState.motorLevel, wantLevel, 1.5, dt);
  const lvl = carState.motorLevel;
  motor.rotor.rotation.z += dt * lvl * 26;
  M.coil.emissiveIntensity = lvl * (1.35 + 0.65 * Math.sin(t * 7.5));
  motor.group.position.set(
    motorHome.x + (Math.random() - 0.5) * 0.0022 * lvl,
    motorHome.y + (Math.random() - 0.5) * 0.0022 * lvl,
    motorHome.z + (Math.random() - 0.5) * 0.0018 * lvl
  );
  updateAudio(lvl);

  // ---- driving ------------------------------------------------------------
  const targetSpeed = carState.driving ? 88 : 0;
  carState.speed = approach(carState.speed, targetSpeed, carState.driving ? 0.45 : 1.1, dt);
  if (carState.driving) carState.battery = Math.max(4, carState.battery - dt * 0.09);
  // visual spin is capped so the spokes never strobe into nonsense
  const omega = Math.min(carState.speed / 3.6 / CAR.wheelR, 13);
  for (const w of wheels){
    w.spin.rotation.z -= omega * dt * w.side;
    if (w.front) w.steer.rotation.y = Math.sin(t * 0.6) * 0.06 * (carState.speed / 90);
  }
  // suspension bob on the body only — the wheels stay planted
  const bob = carState.speed / 90;
  chassis.position.y = Math.sin(t * 6.3) * 0.010 * bob + Math.sin(t * 2.7) * 0.006 * bob;
  chassis.rotation.z = Math.sin(t * 3.1) * 0.0045 * bob;
  chassis.rotation.y = Math.sin(t * 1.7) * 0.0025 * bob;

  // ---- lighting state -----------------------------------------------------
  const lit = carState.lights ? 1 : 0;
  M.headlight.emissiveIntensity = approach(M.headlight.emissiveIntensity, lit ? 1.85 : 0.04, 8, dt);
  M.taillight.emissiveIntensity = approach(M.taillight.emissiveIntensity,
    lit ? (carState.driving ? 2.2 : 1.55) : 0.06, 8, dt);
  M.batteryGlow.emissiveIntensity = approach(M.batteryGlow.emissiveIntensity,
    carState.motorOn ? 1.7 + 0.45 * Math.sin(t * 1.8) : 0.28, 4, dt);
  for (const b of beams) b.intensity = approach(b.intensity, lit ? (carState.night ? 46 : 20) : 0, 6, dt);
  screenMat.emissiveIntensity = 1.0;

  // ---- centre display -----------------------------------------------------
  screenClock += dt;
  if (screenClock > 0.12){ screenClock = 0; drawScreen(); }

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}

// small scripting hook so the demo can be driven from the console
window.aurora = {
  THREE, scene, camera, controls, renderer, car, carState, doors, wheels, motor,
  togglePanel, setLights, setMotor, setDrive, setNight,
  paint: i => M.paint.color.setHex(PAINTS[i].color)
};

// first paint
setNight(false);
syncUI();
drawScreen();
applyResize();
goHome();
animate();
requestAnimationFrame(() => {
  const l = document.getElementById('loader');
  l.classList.add('gone');
  setTimeout(() => l.remove(), 700);
});
</script>
